            @media (prefers-color-scheme: dark) {
                :root { --paper:#12110e; --paper-2:#1b1a16; --ink:#efe9dc; --ink-2:#a39d90; --line:#2f2c25; --accent:#f06a3c; color-scheme: dark; }
            }
            * { box-sizing: border-box; }
            .staticrypt-html, .staticrypt-body { height: 100%; margin: 0; }
            .staticrypt-body { background: var(--paper); color: var(--ink); font: 400 16px/1.5 "Inter Tight", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
            .staticrypt-content { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
            .staticrypt-page { width: 100%; max-width: 380px; }
            .staticrypt-form { text-align: left; }
            .staticrypt-mark { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--ink); color: var(--paper); font: 400 20px/1 "Instrument Serif", Georgia, serif; margin-bottom: 28px; }
            .staticrypt-title { font: 400 40px/1.05 "Instrument Serif", Georgia, serif; margin: 0 0 12px; letter-spacing: -.01em; }
            .staticrypt-instructions p:last-child { color: var(--ink-2); margin: 0; }
            .staticrypt-hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
            .staticrypt-password-container { position: relative; margin-bottom: 14px; }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] {
                width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--paper-2);
                border: 1px solid var(--line); border-radius: 12px; padding: 14px 48px 14px 16px; outline: 0;
            }
            .staticrypt-form input[type="password"]:focus, .staticrypt-form input[type="text"]:focus { border-color: var(--accent); }
            .staticrypt-toggle-password-visibility { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; opacity: .55; cursor: pointer; }
            @media (prefers-color-scheme: dark) { .staticrypt-toggle-password-visibility { filter: invert(1); } }
            label.staticrypt-remember { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); margin-bottom: 20px; }
            .staticrypt-remember input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%; font: 500 15px/1 "Inter Tight", system-ui, sans-serif; color: var(--paper); background: var(--ink);
                border: 0; border-radius: 999px; padding: 15px 22px; cursor: pointer; transition: transform .2s;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover { transform: translateY(-2px); }
            .staticrypt-form .staticrypt-decrypt-button:focus-visible, .staticrypt-form input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; background: var(--paper); }
            .staticrypt-spinner { width: 2rem; height: 2rem; border: .2em solid var(--ink-2); border-right-color: transparent; border-radius: 50%; animation: spinner-border .75s linear infinite; }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
        </style>

            // try to automatically decrypt on load if there is a saved password

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been

                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                const password = document.getElementById("staticrypt-password").value,
